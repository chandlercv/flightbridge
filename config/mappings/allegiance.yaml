# Simple mapping example for Elite Dangerous
vjoy_devices:
  - 1
bindings:
  - input: "x55.axes.0"
    target: "axis:AXIS_X"
    props:
      invert: false
      scale: 1.0
  - input: "x55.axes.1"
    target: "axis:AXIS_Y"
    props:
      invert: false
      scale: 1.0
  - input: "x55.axes.2"
    target: "axis:AXIS_RZ"
    props:
      invert: false
      scale: 1.0
  - input: "x55.button.0"
    target: "button:1"
  - input: "x55.button.1"
    target: "button:2"
  - input: "x55.button.2"
    target: "button:3"
  - input: "x55.button.3"
    target: "button:4"
  - input: "x55.button.4"
    target: "button:5"
  - input: "x55.button.5"
    target: "button:6"
  - input: "x55.button.6"
    target: "button:7"
  - input: "x55.button.7"
    target: "button:8"
  - input: "x55.button.8"
    target: "button:9"
  - input: "x55.button.9"
    target: "button:10"

# off: all and enemy
  - inputs: 
    - "x55.button.10"
    - "flightpanel.button.13"
    target: "key:t"
    props:
      mode: "toggle"
      logic: "and"       # Fire only when both are pressed (no pulse when both false)
      pulse_ms: 100
  - inputs: 
      - "x55.button.11"
      - "flightpanel.button.13"    
    target: "key:e"
