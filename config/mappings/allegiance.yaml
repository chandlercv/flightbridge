  # Pulses button when both switches are in same state (both on OR both off)
  - inputs: 
      - "flightpanel.switch.0"
      - "flightpanel.switch.1"
    target: "key:control key:7"
    props:
      mode: "toggle"
      logic: "and"  # Fires when ALL inputs are true
      pulse_ms: 100
  
  # Flight Panel switches - toggle mode (momentary pulse on change)
  - input: "flightpanel.switch.2"
    target: "key:control key:1"
    props:
      mode: "toggle"
      pulse_ms: 100

  - inputs: 
    - "flightpanel.switch.3"
    - "flightpanel.switch.4"
    target: "key:control key:8"
